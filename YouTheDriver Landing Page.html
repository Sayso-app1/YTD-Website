<head>

  <title>YouTheDriver landing page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading YouTheDriver landing page...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ection: column\"><span style=\"font-size: 9px; color: #5E6569\">Heart rate<\u002Fspan><span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px\">72 bpm<\u002Fspan><\u002Fdiv>\n        <div style=\"padding: 8px; border-radius: 10px; background: #F3F4F2; display: flex; flex-direction: column\"><span style=\"font-size: 9px; color: #5E6569\">Sleep<\u002Fspan><span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px\">6h 20m<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top: auto; margin-left: -14px; margin-right: -14px; height: 58px; border-top: 1px solid #E3E6E1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px; color: #2F7A27\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 9px; font-weight: 600\">Home<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px; color: #6B7478\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"3\"><\u002Frect><path d=\"M10 16V8h3a2.5 2.5 0 0 1 0 5h-3\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 9px\">Parking<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px; color: #6B7478\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 9px\">Community<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px; color: #6B7478\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 4h8v5a4 4 0 0 1-8 0z\"><\u002Fpath><path d=\"M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 9px\">Wellness<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px; color: #6B7478\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"><\u002Frect><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 9px\">Voice<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- floating chips -->\n  <div class=\"ytd-bob\" style=\"position: absolute; left: 730px; top: 290px; width: 200px; box-sizing: border-box; padding: 14px 16px; border-radius: 14px; background: #3A4144; border: 1px solid #4B5357; box-shadow: 0 12px 28px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 4px\">\n    <span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1.4px; color: #AEB5B8\">3:14 A.M. · I-70<\u002Fspan>\n    <span style=\"font-size: 15px; font-weight: 600; color: #ffffff\">Hour 10 of 14<\u002Fspan>\n    <span style=\"font-size: 13px; color: #C6CCCF\">The ELD says he's legal.<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"ytd-bob2\" style=\"position: absolute; left: 1160px; top: 590px; width: 214px; box-sizing: border-box; padding: 14px 16px; border-radius: 14px; background: #F2B53A; box-shadow: 0 12px 28px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 4px\">\n    <span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1.4px; color: #4A3A0F\">YTD CAUGHT IT<\u002Fspan>\n    <span style=\"font-size: 15px; font-weight: 600; color: #2D3235\">His body disagrees.<\u002Fspan>\n    <span style=\"font-size: 13px; color: #3E3413\">Break suggested, 12 mi ahead.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ STAT STRIP ============ -->\n<div style=\"position: relative; height: 76px; flex-shrink: 0; background: #EEF0ED; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 17px; color: #2D3235\">\n  <span aria-hidden=\"true\" style=\"position: absolute; left: 0; bottom: 0; width: 1440px; height: 8px; background: repeating-linear-gradient(90deg, #C9CEC7 0 12px, transparent 12px 22px)\"><\u002Fspan>\n  <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2F7A27\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l10 18H2z\"><\u002Fpath><path d=\"M12 10v5M12 18v.01\"><\u002Fpath><\u002Fsvg>\n  <span><strong style=\"font-weight: 600\">Driver error is the critical reason in 87% of truck crashes<\u002Fstrong> where the truck is at fault. <span style=\"color: #5E6569; font-size: 14px\">(FMCSA LTCCS)<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n\n<!-- ============ PROBLEM ============ -->\n<section id=\"problem\" style=\"height: 1200px; flex-shrink: 0; box-sizing: border-box; padding: 100px 120px; display: flex; flex-direction: column; justify-content: center; gap: 56px\">\n  <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 80px; align-items: center\">\n    <div class=\"ytd-rv\" style=\"display: flex; flex-direction: column; gap: 22px\">\n      <div style=\"display: flex\"><span style=\"padding: 6px 12px; border-radius: 6px; background: #2F7A27; box-shadow: inset 0 0 0 2px #2F7A27, inset 0 0 0 4px #ffffff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1.6px; color: #ffffff\">THE PROBLEM<\u002Fspan><\u002Fdiv>\n      <h2 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 56px; line-height: 1.05; letter-spacing: -1px\">3:14 a.m. on I-70.<br><span style=\"color: #5E6569\">Sixty seconds nobody is watching.<\u002Fspan><\u002Fh2>\n      <p style=\"margin: 0; font-size: 19px; line-height: 1.6; color: #3F4548\">Fatigue doesn't show up on a logbook. It builds quietly over a long clock, and by the time a camera or a scorecard notices, the damage is done. Drivers feel it first, and nothing in the cab is listening.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ytd-rv2\" style=\"display: flex; flex-direction: column; gap: 0; padding-left: 8px\">\n      <div style=\"display: flex; gap: 22px\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; width: 20px\"><span style=\"width: 18px; height: 18px; border-radius: 9px; background: #409C35; flex-shrink: 0\"><\u002Fspan><span style=\"width: 0; flex-grow: 1; border-left: 4px dashed #C9CEC7\"><\u002Fspan><\u002Fdiv>\n        <div style=\"padding-bottom: 30px; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 1.5px; color: #2F7A27\">HOUR TEN<\u002Fspan><span style=\"font-size: 19px; font-weight: 600\">Of a fourteen-hour clock.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 22px\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; width: 20px\"><span style=\"width: 18px; height: 18px; border-radius: 9px; background: #409C35; flex-shrink: 0\"><\u002Fspan><span style=\"width: 0; flex-grow: 1; border-left: 4px dashed #C9CEC7\"><\u002Fspan><\u002Fdiv>\n        <div style=\"padding-bottom: 30px; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 1.5px; color: #2F7A27\">LEGAL ON PAPER<\u002Fspan><span style=\"font-size: 19px; font-weight: 600\">The ELD says he's fine.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 22px\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; width: 20px\"><span style=\"width: 18px; height: 18px; border-radius: 9px; background: #F2B53A; flex-shrink: 0\"><\u002Fspan><span style=\"width: 0; flex-grow: 1; border-left: 4px dashed #C9CEC7\"><\u002Fspan><\u002Fdiv>\n        <div style=\"padding-bottom: 30px; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 1.5px; color: #8A6A12\">THE BODY DISAGREES<\u002Fspan><span style=\"font-size: 19px; font-weight: 600\">Nothing in the cab is listening.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 22px\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; width: 20px\"><span style=\"width: 18px; height: 18px; border-radius: 9px; background: #D9534F; flex-shrink: 0\"><\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 1.5px; color: #B03A36\">THE RUMBLE STRIP<\u002Fspan><span style=\"font-size: 19px; font-weight: 600\">Catches him. This time.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-direction: column; gap: 24px\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between\">\n      <h3 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 28px\">Fatigue costs twice: once in crashes, again in the drivers who quit.<\u002Fh3>\n      <span style=\"font-size: 15px; color: #5E6569\">About $100B a year across the U.S.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"ytd-rv\" style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px\">\n      <div class=\"ytd-lift\" style=\"padding: 26px 24px; border-radius: 16px; background: #F3F4F2; border-top: 6px solid #D9534F; display: flex; flex-direction: column; gap: 8px\">\n        <span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 54px; line-height: 1\">$3.6M<\u002Fspan>\n        <span style=\"font-size: 16px; color: #3F4548; line-height: 1.45\">per fatal truck crash<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ytd-lift\" style=\"padding: 26px 24px; border-radius: 16px; background: #F3F4F2; border-top: 6px solid #F2B53A; display: flex; flex-direction: column; gap: 8px\">\n        <span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 54px; line-height: 1\">$200K<\u002Fspan>\n        <span style=\"font-size: 16px; color: #3F4548; line-height: 1.45\">per non-fatal incident<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ytd-lift\" style=\"padding: 26px 24px; border-radius: 16px; background: #F3F4F2; border-top: 6px solid #409C35; display: flex; flex-direction: column; gap: 8px\">\n        <span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 54px; line-height: 1\">69–90%<\u002Fspan>\n        <span style=\"font-size: 16px; color: #3F4548; line-height: 1.45\">annual driver turnover at truckload fleets<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ytd-lift\" style=\"padding: 26px 24px; border-radius: 16px; background: #F3F4F2; border-top: 6px solid #409C35; display: flex; flex-direction: column; gap: 8px\">\n        <span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 48px; line-height: 1.06\">$8.2K–$20.7K<\u002Fspan>\n        <span style=\"font-size: 16px; color: #3F4548; line-height: 1.45\">to replace a single driver<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ytd-rv\" style=\"padding: 36px 40px; border-radius: 20px; background: #2D3235; display: flex; flex-direction: column; gap: 26px\">\n    <div style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 40px\">\n      <h3 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.2; color: #ffffff\">Today's tools watch the clock or the camera.<br><span style=\"color: #8FD384\">None are built for the driver.<\u002Fspan><\u002Fh3>\n      <span style=\"font-size: 15px; color: #AEB5B8; max-width: 360px; line-height: 1.5\">Reactive, employer-owned, and felt as surveillance, which is why adoption stops at the cab door.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px\">\n      <div style=\"padding: 18px; border-radius: 12px; background: #3A4144; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 16px; font-weight: 600; color: #ffffff\">Hours-of-Service logs<\u002Fspan><span style=\"font-size: 14px; color: #C6CCCF\">Measure the clock, not the human.<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 18px; border-radius: 12px; background: #3A4144; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 16px; font-weight: 600; color: #ffffff\">AI dash cams<\u002Fspan><span style=\"font-size: 14px; color: #C6CCCF\">Fire after the microsleep.<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 18px; border-radius: 12px; background: #3A4144; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 16px; font-weight: 600; color: #ffffff\">Safety scorecards<\u002Fspan><span style=\"font-size: 14px; color: #C6CCCF\">Punish the outcome, weeks late.<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 18px; border-radius: 12px; background: #3A4144; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 16px; font-weight: 600; color: #ffffff\">Caffeine and cold air<\u002Fspan><span style=\"font-size: 14px; color: #C6CCCF\">Free, universal, useless.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ PLATFORM ============ -->\n<section id=\"platform\" style=\"position: relative; height: 720px; flex-shrink: 0; box-sizing: border-box; padding: 100px 120px; background: #F3F4F2; display: flex; flex-direction: column; justify-content: center; gap: 48px\">\n  <svg style=\"position: absolute; left: 0; top: 0\" width=\"1440\" height=\"110\" sc-camel-view-box=\"0 0 1440 110\" aria-hidden=\"true\">\n    <path d=\"M0 0 H1440 V20 C1080 90 360 -10 0 60 Z\" fill=\"#ffffff\"><\u002Fpath>\n    <path class=\"ytd-d34\" d=\"M0 76 C360 6 1080 106 1440 36\" fill=\"none\" stroke=\"#409C35\" stroke-opacity=\"0.45\" stroke-width=\"3\" stroke-dasharray=\"18 16\"><\u002Fpath>\n  <\u002Fsvg>\n  <div class=\"ytd-rv\" style=\"display: flex; justify-content: space-between; align-items: flex-end; gap: 60px\">\n    <div style=\"display: flex; flex-direction: column; gap: 20px; max-width: 680px\">\n      <div style=\"display: flex\"><span style=\"padding: 6px 12px; border-radius: 6px; background: #2F7A27; box-shadow: inset 0 0 0 2px #2F7A27, inset 0 0 0 4px #ffffff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1.6px; color: #ffffff\">THE PLATFORM<\u002Fspan><\u002Fdiv>\n      <h2 style=\"margin: 0; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 46px; line-height: 1.08; letter-spacing: -0.8px\">An app, plus the wearable already on their wrist.<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0; max-width: 420px; font-size: 18px; line-height: 1.6; color: #3F4548\">No cameras, no audio, nothing bolted to the truck. YouTheDriver runs on the driver's own phone and watch, so it goes wherever they go.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px\">\n    <div class=\"ytd-rv ytd-hl\" style=\"padding: 28px 26px; border-radius: 18px; background: #ffffff; border: 1px solid #DADDD8; display: flex; flex-direction: column; gap: 14px\">\n      <span style=\"width: 52px; height: 52px; border-radius: 14px; background: #409C35; color: #ffffff; display: flex; align-items: center; justify-content: center\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"3\"><\u002Frect><path d=\"M9 6l1-3h4l1 3M9 18l1 3h4l1-3M12 10v2l1.5 1\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 1.8px; color: #2F7A27\">PREEMPT<\u002Fspan>\n      <span style=\"font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.25\">Predicts fatigue from the wrist, before the drift.<\u002Fspan>\n      <span style=\"font-size: 15px; line-height: 1.55; color: #3F4548\">Sleep, heart rate and time since the last break roll into one live Green / Yellow / Red status, with a clear next step.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"ytd-rv2 ytd-hl\" style=\"padding: 28px 26px; border-radius: 18px; background: #ffffff; border: 1px solid #DADDD8; display: flex; flex-direction: column; gap: 14px\">\n      <span style=\"width: 52px; height: 52px; border-radius: 14px; background: #409C35; color: #ffffff; display: flex; align-items: center; justify-content: center\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 4h8v5a4 4 0 0 1-8 0z\"><\u002Fpath><path d=\"M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 1.8px; color: #2F7A27\">REWARD<\u002Fspan>\n      <span style=\"font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.25\">Pays drivers for driving rested.<\u002Fspan>\n      <span style=\"font-size: 15px; line-height: 1.55; color: #3F4548\">Points, badges and real rewards for safe, healthy habits, spent on the things drivers actually need on the road.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"ytd-rv3 ytd-hl\" style=\"padding: 28px 26px; border-radius: 18px; background: #ffffff; border: 1px solid #DADDD8; display: flex; flex-direction: column; gap: 14px\">\n      <span style=\"width: 52px; height: 52px; border-radius: 14px; background: #409C35; color: #ffffff; display: flex; align-items: center; justify-content: center\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 1.8px; color: #2F7A27\">CONNECT<\u002Fspan>\n      <span style=\"font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.25\">Ends 250 nights a year alone.<\u002Fspan>\n      <span style=\"font-size: 15px; line-height: 1.55; color: #3F4548\">Live parking, showers and fuel, plus peer intel from drivers in the same fleet and region.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"ytd-rv4 ytd-hl\" style=\"padding: 28px 26px; border-radius: 18px; background: #ffffff; border: 1px solid #DADDD8; display: flex; flex-direction: column; gap: 14px\">\n      <span style=\"width: 52px; height: 52px; border-radius: 14px; background: #409C35; color: #ffffff; display: flex; align-items: center; justify-content: center\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"><\u002Frect><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 1.8px; color: #2F7A27\">ADVOCATE<\u002Fspan>\n      <span style=\"font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.25\">Turns driver concerns into evidence.<\u002Fspan>\n      <span style=\"font-size: 15px; line-height: 1.55; color: #3F4548\">Log an issue by voice in seconds. YTD rolls it into reports that fleets can act on.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ HOW IT WORKS ============ -->\n<section id=\"how\" style=\"position: relative; height: 680px; flex-shrink: 0; box-sizing: border-box; padding: 100px 120px; display: flex; flex-direction: column; justify-content: center; gap: 56px\">\n  <svg style=\"position: absolute; left: 0; top: 0\" width=\"1440\" height=\"110\" sc-camel-view-box=\"0 0 1440 110\" aria-hidden=\"true\">\n    <path d=\"M0 0 H1440 V60 C1080 -10 360 90 0 20 Z\" fill=\"#F3F4F2\"><\u002Fpath>\n    <path class=\"ytd-d34\" d=\"M0 36 C360 106 1080 6 1440 76\" fill=\"none\" stroke=\"#409C35\" stroke-opacity=\"0.45\" stroke-width=\"3\" stroke-dasharray=\"18 16\"><\u002Fpath>\n  <\u002Fsvg>\n  <div class=\"ytd-rv\" style=\"display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center\">\n    <div style=\"display: flex\"><span style=\"padding: 6px 12px; border-radius: 6px; background: #2F7A27; box-shadow: inset 0 0 0 2px #2F7A  gap: 18px; text-align: center\">\n    <div style=\"display: flex\"><span style=\"padding: 6px 12px; border-radius: 6px; background: #2F7A27; box-shadow: inset 0 0 0 2px #2F7A27, inset 0 0 0 4px #ffffff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1.6px; color: #ffffff\">DRIVERS + CARRIERS<\u002Fspan><\u002Fdiv>\n    <h2 style=\"margin: 0; max-width: 820px; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 46px; line-height: 1.08; letter-spacing: -0.8px\">Closing the gap between the cab and the office.<\u002Fh2>\n    <p style=\"margin: 0; max-width: 700px; font-size: 18px; line-height: 1.6; color: #3F4548\">Most safety tech makes drivers feel watched. YTD gives both sides something they want, so trust goes up instead of down.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display: flex; align-items: stretch; gap: 0\">\n    <div class=\"ytd-rvl ytd-hl\" style=\"flex-grow: 1; flex-basis: 0; border-radius: 20px; border: 1px solid #DADDD8; overflow: hidden; display: flex; flex-direction: column\">\n      <div style=\"padding: 20px 28px; background: #2D3235; display: flex; align-items: center; gap: 12px; color: #ffffff\">\n        <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 6h11v10H2zM13 9h4l4 4v3h-8z\"><\u002Fpath><circle cx=\"6\" cy=\"18\" r=\"2\"><\u002Fcircle><circle cx=\"17\" cy=\"18\" r=\"2\"><\u002Fcircle><\u002Fsvg>\n        <span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 1.6px\">FOR THE DRIVER<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding: 28px; display: flex; flex-direction: column; gap: 22px\">\n        <div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-weight: 600; font-size: 18px\">A voice that gets heard<\u002Fspan><span style=\"font-size: 15px; line-height: 1.55; color: #3F4548\">Concerns logged by voice reach the fleet as evidence, not complaints.<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-weight: 600; font-size: 18px\">Paid to do it right<\u002Fspan><span style=\"font-size: 15px; line-height: 1.55; color: #3F4548\">Rewards for rested starts and on-time breaks, not just penalties for mistakes.<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-weight: 600; font-size: 18px\">Your data stays yours<\u002Fspan><span style=\"font-size: 15px; line-height: 1.55; color: #3F4548\">No cameras, no audio. Raw sleep and health details stay private.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ytd-rv2\" style=\"width: 120px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px\">\n      <span style=\"width: 0; height: 60px; border-left: 4px dashed #C9CEC7\"><\u002Fspan>\n      <span class=\"ytd-pulse\" style=\"width: 64px; height: 64px; border-radius: 32px; background: #409C35; color: #ffffff; display: flex; align-items: center; justify-content: center\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8h13l-3-3M20 16H7l3 3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <span style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 1.8px; color: #2F7A27\">TRUST<\u002Fspan>\n      <span style=\"width: 0; height: 60px; border-left: 4px dashed #C9CEC7\"><\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"ytd-rvr ytd-hl\" style=\"flex-grow: 1; flex-basis: 0; border-radius: 20px; border: 1px solid #DADDD8; overflow: hidden; display: flex; flex-direction: column\">\n      <div style=\"padding: 20px 28px; background: #2F7A27; display: flex; ali
